# A new dsh release should turn this repo red, not quietly break the plugin.
#
# Users install plugins with `dsh plugin --profile <p> add <spec>`: a
# compatibility gate checks the harness peer ranges against the running dsh,
# then pnpm installs into the profile, and any harness import the profile does
# not physically hold resolves to the host's copy. The check does exactly that
# against dsh `latest` (and `next` as an advisory), in a scratch DSH_HOME, and
# fails when the gate refuses the plugin or when the plugin drags a package the
# host already supplies into the profile. See scripts/check-dsh-release.mjs.
#
# A red scheduled run notifies nobody, so the scheduled run opens an issue.
name: dsh-release-watch

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['package.json', 'scripts/check-dsh-release.mjs', '.github/workflows/dsh-release-watch.yml']

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # `dsh plugin add` runs pnpm (>= 10 reads pnpm-workspace.yaml).
      - run: npm install --global pnpm@11

      # `--tree-only` on a pull request: the published package is still the
      # broken one on the very PR that fixes it, so gating a PR on it would
      # make this check red on its own fix. The scheduled run owns that half —
      # it is also the only run that can ever see it clear.
      - id: check
        run: |
          set +e
          node scripts/check-dsh-release.mjs ${{ github.event_name == 'pull_request' && '--tree-only' || '' }} > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md
          set -e

      # A pull request wants the answer in its own checks, not in an issue.
      - if: github.event_name == 'pull_request' && steps.check.outputs.status != '0'
        run: exit 1

      - if: github.event_name != 'pull_request' && steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "${{ steps.check.outputs.status }}" = "2" ]; then
              echo "The daily dsh release check could not finish."
            else
              echo "Installing this plugin with \`dsh plugin add\` beside current dsh no longer works cleanly:"
              echo "either the compatibility gate refused it, or the profile now carries a package the host supplies."
              echo
              echo "Refused: prove the plugin works on the new dsh (a real session, not only the suite), then"
              echo "widen every harness peer range to cover it. Shadowed host package: move it from"
              echo "\`dependencies\` to \`peerDependencies\`. Either way, publish — a fix on main that never"
              echo "reaches npm leaves every user broken."
            fi
            echo
            cat report.md
          } > issue.md
          # `gh issue list --label` errors on a label that does not exist yet,
          # which would swallow the very first alert.
          gh label create dsh-release --color B60205 --force \
            --description "A dsh release moved out from under this plugin"
          open=$(gh issue list --label dsh-release --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue.md
          else
            gh issue create --title "A dsh release moved out from under this plugin" --label dsh-release --body-file issue.md
          fi
